# Seed a fresh machine's omp settings from this snapshot. Never overwrites an
# existing config.yml — after changing settings, re-export by hand:
#   cp ~/.omp/agent/config.yml omp/config.yml
POST if [ -e ~/.omp/agent/config.yml ]; then warn "omp: ~/.omp/agent/config.yml already exists (not overwritten)"; else mkdir -p ~/.omp/agent && cp config.yml ~/.omp/agent/config.yml; fi
