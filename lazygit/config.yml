# Rosé Pine for lazygit — https://github.com/rose-pine/lazygit
# Moon/Dawn variants are in the upstream repo; swap the hex values below.
gui:
  theme:
    activeBorderColor:
      - "#31748f"
      - bold
    inactiveBorderColor:
      - "#6e6a86"
    searchingActiveBorderColor:
      - "#ebbcba"
      - bold
    optionsTextColor:
      - "#9ccfd8"
    selectedLineBgColor:
      - "#31748f"
    inactiveViewSelectedLineBgColor:
      - "#26233a"
      - bold
    cherryPickedCommitFgColor:
      - "#1f1d2e"
    cherryPickedCommitBgColor:
      - "#ebbcba"
    markedBaseCommitFgColor:
      - "#9ccfd8"
    markedBaseCommitBgColor:
      - "#f6c177"
    unstagedChangesColor:
      - "#eb6f92"
    defaultFgColor:
      - "#e0def4"
git:
  # SSH commit signing (not GPG) with the key held in the macOS keychain via
  # ssh-agent, so there's never an interactive passphrase prompt. lazygit
  # can't tell that apart from bare commit.gpgsign and blocks some features
  # (e.g. inline commit/amend) unless told an agent is handling it.
  overrideGpg: true
  diffRenderers:
    - colorArg: always
      command: delta --paging=never --features=rose-pine --syntax-theme=rose-pine
      useConfig: false
