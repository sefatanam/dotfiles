unbind r
bind r source-file ~/.tmux.conf \; display-message "🔄 tmux config reloaded!"
bind R refresh-client \; display-message "🔄 Display refreshed!"
set -g prefix C-a
# Terminal and environment settings
set -g default-terminal "${TERM}"
set-option -g default-terminal "screen-256color"
set -g allow-passthrough on  # @REVIEW: Required for kitty graphics protocol (Snacks.image)
set -g focus-events on
set -g mouse on
set -g history-limit 10000
set -g status-interval 1
set -g escape-time 10
set -g repeat-time 500
set -g display-time 2000

# Display refresh fixes for copy mode and background processes
set -g monitor-activity on
set -g visual-activity off
set -g bell-action none
set -g display-panes-time 2000       # Show pane numbers for 2 seconds

# Window and pane indexing
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off

# ==============================================================================
# KEYBINDINGS
# ==============================================================================

# Pane navigation (vim-style)
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Window navigation
bind -n C-Left previous-window
bind -n C-Right next-window

# Pane selection with Shift
bind -n S-Left select-pane -L
bind -n S-Down select-pane -D
bind -n S-Up select-pane -U
bind -n S-Right select-pane -R

# Pane resizing
bind -r S-Left resize-pane -L 5
bind -r S-Down resize-pane -D 5
bind -r S-Up resize-pane -U 5
bind -r S-Right resize-pane -R 5

# Window swapping
bind -r \> swap-window -t +1 \; select-window -t +1
bind -r \< swap-window -t -1 \; select-window -t -1

# Pane swapping and layout
bind -r \} swap-pane -D
bind -r \{ swap-pane -U
bind -r space select-layout -n

# Splitting panes
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# Pane joining and breaking
bind j choose-tree -F "#{E:@custom_choose_tree_format}" -Z "join-pane -h -s "%%""
bind J choose-tree -F "#{E:@custom_choose_tree_format}" -Z "join-pane -v -s "%%""
bind b if-shell " [ #{window_panes} -gt '1' ] " { break-pane -a }

# Simple detach with VPN stop - just press 'd' as usual
# Catch is the tmux session_name should be exact - vpn
bind d run-shell "tmux send-keys -t vpn C-c 2>/dev/null; sleep 0.3; tmux send-keys -t vpn C-c 2>/dev/null; tmux detach-client"

# ==============================================================================
# COPY MODE
# ==============================================================================

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
# Enhanced copy mode with automatic refresh to prevent stuck display
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel \; refresh-client
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle
bind-key -T copy-mode-vi 'Escape' send -X cancel
bind-key -T copy-mode-vi 'Enter' send -X copy-selection-and-cancel \; refresh-client
unbind -T copy-mode-vi MouseDragEnd1Pane

# Copy mode display styles for better visual feedback
set -g copy-mode-mark-style "bg=black,fg=white"
set -g copy-mode-match-style "bg=yellow,fg=black"
set -g copy-mode-current-match-style "bg=red,fg=black"

# Transparency support for popups in Ghostty
set -ga terminal-overrides ",xterm-ghostty:RGB"

# Force transparent popup background (no fallback to black)
set -g popup-style 'bg=default,fg=default'
set -g popup-border-style 'bg=default,fg=green'
set -g popup-border-lines rounded

# Pane borders transparent
set -g pane-border-style 'bg=default'
set -g pane-active-border-style 'bg=default'

# ==============================================================================
# DISPLAY POPUPS
# ==============================================================================

# Git management
bind C-y display-popup \
  -d "#{pane_current_path}" \
  -w 90% \
  -h 90% \
  -E "lazygit"

# Session management
bind C-n display-popup -E 'bash -i -c "read -p \"Session name: \" name; tmux new-session -d -s \$name && tmux switch-client -t \$name"'
bind C-j display-popup -E "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"

# File management
bind C-r display-popup \
  -d "#{pane_current_path}" \
  -w 90% \
  -h 90% \
  -E "yazi"

# Shell and editor
bind C-t display-popup \
  -d "#{pane_current_path}" \
  -w 75% \
  -h 75% \
  -E "zsh"
bind C-z display-popup \
  -w 80% \
  -h 80% \
  -E 'nvim ~/.zshrc'

# ==============================================================================
# CHOOSE TREE FORMAT
# ==============================================================================

# Updated choose tree format with modern nerd font icons
set -g @custom_choose_tree_format "\
#{?pane_format,\
#{?pane_marked,#[bg=black],}\
#[fg=green] 󰆍 #{session_name} \
#{E:#{@custom_separator}}#[fg=red] 󰘔 #{pane_current_command} \
#{E:#{@custom_separator}}#[fg=blue] 󰉋 #{pane_current_path} \
#{?window_zoomed_flag,#{?pane_active,#{E:#{@custom_separator}}#[fg=yellow] 󰍉 zoom ,},}\
#{?pane_marked,#{E:#{@custom_separator}}#[fg=yellow] 󰃀 marked ,}\
#{?pane_active,#{E:#{@custom_separator}}#[fg=yellow] 󰐾 active ,}\
,}\
#{?window_format,\
#{?window_marked_flag,#[bg=black],}\
#{?window_active,#{#[fg=red,reverse]},\
#{?window_last_flag,#[fg=red],#[fg=white]}\
}\
 󰖯 #I #{window_name} \
#{#[fg=white,none]}\
#{?#{==:#{window_panes},1},\
#[fg=green] 󰆍 #{session_name} \
#{E:#{@custom_separator}}#[fg=red] 󰘔 #{pane_current_command} \
#{E:#{@custom_separator}}#[fg=blue] 󰉋 #{pane_current_path} \
#{?window_marked_flag,#{E:#{@custom_separator}}#[fg=yellow] 󰃀 marked ,}\
,}\
,}\
#{?session_format,\
#{session_windows} windows\
#{?session_grouped, (group #{session_group}: #{session_group_list}),}\
#{?session_attached, (attached),}\
,}
"

# Window selection
bind -n C-Down choose-session -ZN -F "#{E:@custom_choose_tree_format}"
bind -n C-Up choose-tree -Z -F "#{E:@custom_choose_tree_format}"

# ==============================================================================
# PLUGINS
# ==============================================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Plugin configurations
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# ==============================================================================
# STATUS BAR
# ==============================================================================

set -g status-position top
set -g status-left-length 80
set -g status-left ""
set -g status-right-length 160
set -g status-right ""

# Custom separator
set -g @custom_separator "#[fg=brightblack,none]|"

# Status right components
set -ga status-right "#[fg=green,bg=default]"
set -ga status-right "#{?client_prefix,#[#{fg=green}]#[reverse]#[bold],}"
set -ga status-right " #{?#{e|>:#{window_width},90}, #S,} "
set -ga status-right "#{?client_prefix,#[none],}"
set -ga status-right "#{E:#{@custom_separator}}"

set -ga status-right "#[fg=red,bg=default]"
set -ga status-right " #{?#{e|>:#{window_width},80}, #{pane_current_command},} "
set -ga status-right "#{E:#{@custom_separator}}"

set -ga status-right "#[fg=blue,bg=default]"
set -ga status-right " #{?#{e|>:#{window_width},80}, #{=/24/...:#{b:pane_current_path}},} "
set -ga status-right "#{E:#{@custom_separator}}"

set -ga status-right "#{?window_zoomed_flag,"
set -ga status-right "#[fg=yellow]#[bg=default]"
set -ga status-right " #{?#{e|>:#{window_width},110}, zoom,} "
set -ga status-right "#{E:#{@custom_separator}}"
set -ga status-right ",}"

set -ga status-right "#{?pane_marked,"
set -ga status-right "#[fg=yellow]#[bg=default]"
set -ga status-right " #{?#{e|>:#{window_width},110}, marked,} "
set -ga status-right "#{E:#{@custom_separator}}"
set -ga status-right ",}"
 

set -ga status-right "#[fg=white,bg=default]"
set -ga status-right " #{?#{e|>:#{window_width},85}, %H:%M,} "

# ==============================================================================
# WINDOW AND PANE STYLES
# ==============================================================================

# Pane borders
setw -g pane-border-status off
setw -g pane-border-format ""
setw -g pane-active-border-style "bg=default,fg=red"
setw -g pane-border-style "bg=default,fg=brightblack"
setw -g pane-border-lines single

# Window status
set -wg automatic-rename on
set -g automatic-rename-format "window"
set -g window-status-format " #{?#{==:#{window_name},window},#I,#W}:#{pane_current_command} #{E:#{@custom_separator}}"
set -g window-status-last-style "fg=red"
set -g window-status-activity-style "fg=red,bold"
set -g window-status-bell-style "fg=red,bold"
set -g window-status-current-format " #{?#{==:#{window_name},window},#I,#W} #{E:#{@custom_separator}}"
set -g window-status-current-style "fg=red,bold,reverse"
set -g status-style "fg=white bg=default"

# Bootstrap TPM if not installed
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TPM
run '~/.tmux/plugins/tpm/tpm'
