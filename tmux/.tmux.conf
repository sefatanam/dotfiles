# @REVIEW: Core tmux behavior
set -g prefix C-a                    # Change prefix to Ctrl-a
set -g mouse on                      # Enable mouse support
set -g base-index 1                  # Start window numbering at 1
set -g pane-base-index 1             # Start pane numbering at 1
set -g renumber-windows on           # Renumber windows when one is closed
set -g detach-on-destroy off         # Don't detach when destroying session

# @REVIEW: Performance & responsiveness
set -g escape-time 10                # Faster command sequences
set -g repeat-time 500               # Repeat time for repeated commands
set -g display-time 2000             # Display messages for 2 seconds
set -g status-interval 5             # Update status every 5 seconds (battery friendly)

# @REVIEW: Terminal capabilities
set -g default-terminal "tmux-256color"
set -g focus-events on
set -g status-position top

# ╭──────────────────────────────────────────────────────────────────────────────╮
# │                              KEY BINDINGS                                   │
# ╰──────────────────────────────────────────────────────────────────────────────╯

# @REVIEW: Config reload
unbind r
bind r source-file ~/.tmux.conf \; display-message "🔄 tmux config reloaded!"

# @REVIEW: Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# @REVIEW: Window navigation
bind -n C-Left previous-window
bind -n C-Right next-window
bind -r > swap-window -t +1\; select-window -t +1
bind -r < swap-window -t -1\; select-window -t -1

# @REVIEW: Pane operations
bind v split-window -h -c "#{pane_current_path}"    # Vertical split
bind s split-window -v -c "#{pane_current_path}"    # Horizontal split
bind b if-shell "[ #{window_panes} -gt '1' ]" { break-pane -a }

# @REVIEW: Pane resizing
bind -r S-Left resize-pane -L 5
bind -r S-Down resize-pane -D 5
bind -r S-Up resize-pane -U 5
bind -r S-Right resize-pane -R 5

# @REVIEW: Pane swapping and layout
bind -r \} swap-pane -D
bind -r \{ swap-pane -U
bind -r Space select-layout -n

# ╭──────────────────────────────────────────────────────────────────────────────╮
# │                              COPY MODE                                      │
# ╰──────────────────────────────────────────────────────────────────────────────╯

# @REVIEW: Vim-style copy mode
set -g mode-keys vi
bind -T copy-mode-vi 'v' send -X begin-selection
bind -T copy-mode-vi 'y' send -X copy-selection
unbind -T copy-mode-vi MouseDragEnd1Pane

# ╭──────────────────────────────────────────────────────────────────────────────╮
# │                               POPUPS                                        │
# ╰──────────────────────────────────────────────────────────────────────────────╯

# @REVIEW: Intelligent popup system
bind C-y display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "lazygit"
bind C-r display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "yazi"
bind C-t display-popup -d "#{pane_current_path}" -w 75% -h 75% -E "zsh"
bind C-z display-popup -w 80% -h 80% -E 'nvim ~/.tmux.conf'

# @REVIEW: Session management popups
bind C-n display-popup -E 'bash -i -c "read -p \"Session name: \" name; tmux new-session -d -s \$name && tmux switch-client -t \$name"'
bind C-j display-popup -E "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"

# @REVIEW: Advanced pane operations with popups
bind j choose-tree -F "#{E:@custom_choose_tree_format}" -Z "join-pane -h -s \"%%\""
bind J choose-tree -F "#{E:@custom_choose_tree_format}" -Z "join-pane -v -s \"%%\""

# ╭──────────────────────────────────────────────────────────────────────────────╮
# │                              PLUGINS                                        │
# ╰──────────────────────────────────────────────────────────────────────────────╯

# @REVIEW: Plugin management
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# @REVIEW: Plugin configurations
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# ╭──────────────────────────────────────────────────────────────────────────────╮
# │                             THEME SETUP                                     │
# ╰──────────────────────────────────────────────────────────────────────────────╯

# @REVIEW: Catppuccin theme configuration
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_status_background "none"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"
# @NOT-NEED: Slanted style causes visual rendering issues
# set -g @catppuccin_window_status_style "slanted"
# @NOT-NEED: Basic style replaced with none
# set -g @catppuccin_window_status_style "basic"
set -g @catppuccin_window_status_style "none"

# @REVIEW: Battery icons
set -g @batt_icon_charge_tier8 ''
set -g @batt_icon_charge_tier7 ''
set -g @batt_icon_charge_tier6 ''
set -g @batt_icon_charge_tier5 ''
set -g @batt_icon_charge_tier4 ''
set -g @batt_icon_charge_tier3 ''
set -g @batt_icon_charge_tier2 ''
set -g @batt_icon_charge_tier1 ''
set -g @batt_icon_status_charged ''
set -g @batt_icon_status_charging ''
set -g @batt_icon_status_discharging ''

# @REVIEW: System monitoring format
set -g @cpu_percentage_format "%3.0f%%"
set -g @ram_percentage_format "%3.0f%%"

# ╭──────────────────────────────────────────────────────────────────────────────╮
# │                             STATUS BAR                                      │
# ╰──────────────────────────────────────────────────────────────────────────────╯

# @REVIEW: Status bar configuration
set -g status-left-length 80
set -g status-left ""
set -g status-right-length 160
set -g status-right ""

# @REVIEW: Custom variables
set -g @custom_separator "#[fg=#{@thm_overlay_0},none]│"

# @REVIEW: Status right components (responsive design)
set -ga status-right "#[fg=#{@thm_green}]#{?client_prefix,#[reverse]#[bold],} #{?#{e|>:#{window_width},90}, #S,} #{?client_prefix,#[none],}#{E:#{@custom_separator}}"
set -ga status-right "#[fg=#{@thm_maroon}] #{?#{e|>:#{window_width},80}, #{pane_current_command},} #{E:#{@custom_separator}}"
set -ga status-right "#[fg=#{@thm_blue}] #{?#{e|>:#{window_width},80}, #{=/20/...:#{b:pane_current_path}},} #{E:#{@custom_separator}}"
set -ga status-right "#{?window_zoomed_flag,#[fg=#{@thm_yellow}] zoom #{E:#{@custom_separator}},}"
set -ga status-right "#{?#{e|>:#{window_width},115},#[fg=#{@thm_teal}] #{cpu_percentage} #{E:#{@custom_separator}},}"
set -ga status-right "#{?#{e|>:#{window_width},115},#[fg=#{@thm_sky}] #{ram_percentage} #{E:#{@custom_separator}},}"
set -ga status-right "#[fg=#{@thm_pink}] #{?#{battery_percentage},#{battery_icon} #{battery_percentage},#{@batt_icon_status_charged}} #{E:#{@custom_separator}}"
set -ga status-right "#[fg=#{@thm_lavender}] #{?#{e|>:#{window_width},95},%Y-%m-%d ,}#{E:#{@custom_separator}}"
set -ga status-right "#[fg=#{@thm_fg}] %H:%M "

# ╭──────────────────────────────────────────────────────────────────────────────╮
# │                              WINDOW STYLE                                   │
# ╰──────────────────────────────────────────────────────────────────────────────╯

# @REVIEW: Window appearance
set -g automatic-rename on
set -g automatic-rename-format "window"
set -g window-status-format " #{?#{==:#{window_name},window},#I,#W}:#{pane_current_command} #{E:#{@custom_separator}}"
set -g window-status-current-format " #{?#{==:#{window_name},window},#I,#W} #{E:#{@custom_separator}}"
set -g window-status-current-style "fg=#{@thm_peach},bold,reverse"
set -g window-status-last-style "fg=#{@thm_peach}"
set -g window-status-activity-style "fg=#{@thm_red},bold"
set -g window-status-bell-style "fg=#{@thm_red},bold"

# ╭──────────────────────────────────────────────────────────────────────────────╮
# │                              PANE STYLE                                     │
# ╰──────────────────────────────────────────────────────────────────────────────╯

# @REVIEW: Pane borders
set -g pane-border-status off
set -g pane-border-format ""
set -g pane-active-border-style "bg=default,fg=#{@thm_peach}"
set -g pane-border-style "bg=default,fg=#{@thm_overlay_1}"
set -g pane-border-lines single

# ╭──────────────────────────────────────────────────────────────────────────────╮
# │                          ADVANCED FEATURES                                  │
# ╰──────────────────────────────────────────────────────────────────────────────╯

# @REVIEW: Smart session/window navigation
bind -n C-Up choose-tree -Z -F "#{E:@custom_choose_tree_format}"
bind -n C-Down choose-session -ZN -F "#{E:@custom_choose_tree_format}"

# @REVIEW: Custom choose tree format
set -g @custom_choose_tree_format "\
#{?pane_format,\
#{?pane_marked,#[bg=#{@thm_surface_1}],}\
#[fg=#{@thm_green}] 󰆍 #{session_name} \
#{E:#{@custom_separator}}#[fg=#{@thm_maroon}] 󰘔 #{pane_current_command} \
#{E:#{@custom_separator}}#[fg=#{@thm_blue}] 󰉋 #{pane_current_path} \
#{?window_zoomed_flag,#{?pane_active,#{E:#{@custom_separator}}#[fg=#{@thm_yellow}] 󰍉 zoom ,},}\
#{?pane_marked,#{E:#{@custom_separator}}#[fg=#{@thm_yellow}] 󰃀 marked ,}\
#{?pane_active,#{E:#{@custom_separator}}#[fg=#{@thm_yellow}] 󰐾 active ,}\
,}\
#{?window_format,\
#{?window_marked_flag,#[bg=#{@thm_surface_1}],}\
#{?window_active,#{#[fg=#{@thm_peach},reverse]},\
#{?window_last_flag,#[fg=#{@thm_peach}],#[fg=#{@thm_rosewater}]}\
} 󰖯 #I #{window_name} \
#{#[fg=#{@thm_rosewater},none]}\
#{?#{==:#{window_panes},1},\
#[fg=#{@thm_green}] 󰆍 #{session_name} \
#{E:#{@custom_separator}}#[fg=#{@thm_maroon}] 󰘔 #{pane_current_command} \
#{E:#{@custom_separator}}#[fg=#{@thm_blue}] 󰉋 #{pane_current_path} \
#{?window_marked_flag,#{E:#{@custom_separator}}#[fg=#{@thm_yellow}] 󰃀 marked ,}\
,}\
,}\
#{?session_format,\
#{session_windows} windows\
#{?session_grouped, (group #{session_group}: #{session_group_list}),}\
#{?session_attached, (attached),}\
,}"

# ╭──────────────────────────────────────────────────────────────────────────────╮
# │                          PLUGIN BOOTSTRAP                                   │
# ╰──────────────────────────────────────────────────────────────────────────────╯

# @REVIEW: Auto-install TPM if not present
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# @REVIEW: Initialize plugin manager
run '~/.tmux/plugins/tpm/tpm'